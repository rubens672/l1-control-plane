server:
  port: 8080

spring:
  application:
    name: ingest-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql:///${DB_NAME}?cloudSqlInstance=${CLOUDSQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    username: ${DB_USER}
    password: ${DB_PASS}

app:
  pubsub:
    topic: ${PUBSUB_TOPIC}
  cache:
    allowTtlMinutes: 10
    denyTtlSeconds: 90
    maximumSize: 50000