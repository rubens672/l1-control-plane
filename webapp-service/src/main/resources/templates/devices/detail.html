<!DOCTYPE html>
<html th:replace="~{layout :: layout('Dettagli Dispositivo', ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<body>
<section>
    <div class="mb-4">
        <a th:if="${siteId != null}" th:href="@{/devices(siteId=${siteId}, tenantId=${tenantId})}" class="text-decoration-none">&larr; Torna ai dispositivi</a>
        <a th:if="${siteId == null}" href="javascript:history.back()" class="text-decoration-none">&larr; Torna indietro</a>
    </div>

    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">Dettagli Dispositivo</h4>
                    <span class="badge bg-secondary">PENDING</span>
                </div>
                <div class="card-body">
                    <p><strong>Device ID:</strong> <span class="text-monospace" th:text="${deviceId}"></span></p>
                    
                    <hr>
                    
                    <h5>Provisioning</h5>
                    <p class="text-muted small">Genera un token di bootstrap per questo dispositivo in modo che possa scaricare i propri certificati mTLS al primo avvio.</p>
                    
                    <form th:action="@{/devices/{id}/bootstrap-token(id=${deviceId})}" method="post">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-download"></i> Scarica Bootstrap JSON
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
