<!DOCTYPE html>
<html th:replace="~{layout :: layout('Nuovo Tenant', ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<body>
<section>
    <div class="mb-3">
        <a href="/tenants" class="text-decoration-none">&larr; Torna alla lista</a>
    </div>

    <div class="card shadow-sm col-md-8 mx-auto">
        <div class="card-header bg-white">
            <h4 class="mb-0">Crea Nuovo Tenant</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/tenants/create}" th:object="${form}" method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">Nome Azienda</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" required>
                </div>
                
                <div class="mb-3">
                    <label for="plan" class="form-label">Piano Commerciale</label>
                    <select class="form-select" id="plan" th:field="*{plan}">
                        <option value="BASIC">Basic</option>
                        <option value="PREMIUM">Premium</option>
                        <option value="ENTERPRISE">Enterprise</option>
                    </select>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary text-white">Salva Tenant</button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
