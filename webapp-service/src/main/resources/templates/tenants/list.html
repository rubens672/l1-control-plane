<!DOCTYPE html>
<html th:replace="~{layout :: layout('Gestione Tenants', ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Tenants</h1>
        <a href="/tenants/create" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nuovo Tenant</a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Piano</th>
                    <th>Status</th>
                    <th>Azioni</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tenant : ${tenants}">
                    <td class="text-monospace text-muted small" th:text="${tenant.tenantId}">id</td>
                    <td class="fw-bold" th:text="${tenant.name}">Nome</td>
                    <td><span class="badge bg-secondary" th:text="${tenant.plan}">BASIC</span></td>
                    <td>
                        <span th:class="${tenant.status == 'ACTIVE' ? 'badge bg-success' : 'badge bg-warning'}" th:text="${tenant.status}">ACTIVE</span>
                    </td>
                    <td>
                        <a th:href="@{/sites(tenantId=${tenant.tenantId})}" class="btn btn-sm btn-outline-info" title="Gestisci Siti"><i class="bi bi-building"></i> Siti</a>

                        <!-- Mini form for subscription for demo purposes -->
                        <form th:action="@{/subscriptions/create}" method="post" class="d-inline" th:if="${tenant.status == 'ACTIVE'}">
                            <input type="hidden" name="tenantId" th:value="${tenant.tenantId}" />
                            <input type="hidden" name="validDays" value="365" />
                            <input type="hidden" name="maxDevices" value="10" />
                            <button type="submit" class="btn btn-sm btn-outline-success" title="Crea/Rinnova Sub"><i class="bi bi-card-checklist"></i> Sub</button>
                        </form>
                        
                        <!-- Delete Subscription -->
                        <form th:action="@{/subscriptions/{id}/delete(id=${tenant.tenantId})}" method="post" class="d-inline" th:if="${tenant.status == 'ACTIVE'}">
                            <button type="submit" class="btn btn-sm btn-outline-warning" title="Elimina Sub" onclick="return confirm('Sicuro di disattivare l\'abbonamento per questo tenant?');"><i class="bi bi-trash"></i> Sub</button>
                        </form>

                        <!-- Delete Tenant -->
                        <form th:action="@{/tenants/{id}/delete(id=${tenant.tenantId})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Elimina Tenant" onclick="return confirm('ATTENZIONE: Questo eliminerà anche Tutti i Siti e i Devices associati. Procedere?');"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tenants)}">
                    <td colspan="5" class="text-center text-muted py-4">Nessun tenant trovato. Crea il primo!</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
