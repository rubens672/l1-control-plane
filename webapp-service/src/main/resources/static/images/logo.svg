<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 140" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e72e1" />
      <stop offset="100%" stop-color="#243b88" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <g transform="translate(10, 10) scale(0.6)" filter="url(#shadow)">
    <rect x="110" y="0" width="100" height="100" rx="10" fill="url(#grad)" />
    <rect x="0" y="95" width="100" height="100" rx="10" fill="url(#grad)" />
    <rect x="220" y="95" width="100" height="100" rx="10" fill="url(#grad)" />
  </g>
  
  <text x="215" y="75" font-family="'Inter', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="900" font-size="64" fill="#000" letter-spacing="-1">BERTI</text>
  <text x="220" y="115" font-family="'Inter', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="400" font-size="24" letter-spacing="1" fill="#333">AI &amp; CLOUD ARCHITECTURE</text>
</svg>
