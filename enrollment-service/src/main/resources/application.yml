server:
  address: 0.0.0.0
  port: ${PORT:8081}

spring:
  application:
    name: enrollment-service
  config:
    import: sm://
  # dice a Spring di non sostituire il tuo datasource configurato con uno in-memory
  test:
    database:
      replace: none
  datasource:
    url: jdbc:postgresql:///${SUBSCRIPT_MANAGE_DB_SCHEMA}?cloudSqlInstance=${SUBSCRIPT_MANAGE_DB}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    username: ${sm://projects/782332691073/secrets/DB_USER/versions/1}
    password: ${sm://projects/782332691073/secrets/DB_PASSW/versions/1}
    driver-class-name: org.postgresql.Driver

  # Disabilita Cloud SQL autoconfigure per i test
  cloud:
    gcp:
      sql:
        enabled: false
      secretmanager:
        enabled: true

app:
  bootstrap:
    hmacKeyBase64: ${sm://projects/782332691073/secrets/BOOTSTRAP_HMAC_KEY_BASE64/versions/1}
gcp:
  cas:
    project-id: ${GCP_PROJECT_ID:782332691073}
    location: ${CAS_LOCATION:europe-west1}
    ca-pool-id: ${CAS_POOL_ID:device-pool}
    # Se commentato, sceglierà la CA attiva nel pool automaticamente (raccomandato)
    # certificate-authority-id: device-ca
    lifetime-days: 365