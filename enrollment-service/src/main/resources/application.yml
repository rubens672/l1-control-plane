server:
  address: 0.0.0.0
  port: ${PORT:8081}

spring:
  application:
    name: enrollment-service
  config:
    import: sm://
  # dice a Spring di non sostituire il tuo datasource configurato con uno in-memory
  test:
    database:
      replace: none
  data:
    mongodb:
      uri: mongodb://${sm://projects/782332691073/secrets/DB_USER/versions/2}:${sm://projects/782332691073/secrets/DB_PASSW/versions/2}@6b676047-d20d-4f5d-8f4b-f5fe474068b9.us-central1.firestore.goog:443/control-plane-gateway-fb?loadBalanced=true&tls=true&authMechanism=SCRAM-SHA-256&retryWrites=false

  cloud:
    gcp:
      secretmanager:
        enabled: true

app:
  bootstrap:
    hmacKeyBase64: ${sm://projects/782332691073/secrets/BOOTSTRAP_HMAC_KEY_BASE64/versions/1}
  ca:
    # Secret Manager resource ids (version latest) o direttamente value via env
    issuingKeySecret: ${sm://projects/782332691073/secrets/CA_ISSUING_KEY_SECRET/versions/1} #${CA_ISSUING_KEY_SECRET}     # es: projects/<p>/secrets/issuingCA-key/versions/latest
    issuingCertSecret: ${sm://projects/782332691073/secrets/CA_ISSUING_CERT_SECRET/versions/1} #${CA_ISSUING_CERT_SECRET}   # es: projects/<p>/secrets/issuingCA-cert/versions/latest
    #chainSecret: ${sm://projects/383163155925/secrets/CA_CHAIN_SECRET/versions/1} #${CA_CHAIN_SECRET}                # opzionale; se non c'è, usa issuingCert come chain
  cert:
    validityDays: 365