spring:
  config:
    import: sm://
  # dice a Spring di non sostituire il tuo datasource configurato con uno in-memory
  test:
    database:
      replace: none


  cloud:
    gcp:

      # Assicurati che Secret Manager sia abilitato anche in test
      secretmanager:
        enabled: false

app:
  bootstrap:
    tokenTtlMinutes: 60
    hmacKeyBase64: ${sm://projects/782332691073/secrets/BOOTSTRAP_HMAC_KEY_BASE64/versions/1}
    enrollmentUrl: ${ENROLLMENT_URL}
    telemetryUrl: ${TELEMETRY_URL}